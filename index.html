<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css" />
    <!-- <script defer src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
  </head>
  <body>
    <header>
      <nav class="flex justify-between py-8 px-16 items-center">
        <h1 class="text-4xl font-bold">Locksmith</h1>

        <ul class="navlinks flex items-center gap-8 uppercase">
          <li class="active"><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>

        <button class="text-2xl font-semibold bg-[gold]cursor-pointer">
          123456789
        </button>
      </nav>

      <!-- ----------------HERO SECTION------------------ -->
      <section
        id="hero-section"
        class="bg-[url(./images/HeroBg.jpg)] min-h-screen bg-cover bg-center flex items-center justify-center"
      >
        <div class="text-center bg-black/50 text-white">
          <h1 class="text-[gold] text-xl tracking-[0.3rem]">BEST LOCKSMITH</h1>

          <p class="text-5xl capitalize leading-[4rem] my-4">
            We provide Best locksmith services all over the world
          </p>

          <button>Contact us</button>
        </div>
      </section>

      <div class="quote-cont">
        <h1>Get a quote</h1>

        <form>
          <input type="text" placeholder="Name" class="p-2" />
          <input type="text" placeholder="Phone" />
          <select name="" id="">
            <option value="">Services</option>
            <option value="">Access</option>
            <option value="">Safes</option>
          </select>

          <button type="submit">Get a quote</button>
        </form>
      </div>
    </header>
  </body>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</html>
